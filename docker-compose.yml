services:
  db:
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
    environment:
      DB_HOST: db
    command: sh -c "python manage.py migrate"
    depends_on:
      db:
        condition: service_healthy

  static_collector:
    build: .
    command: sh -c "python manage.py collectstatic --no-input"
    env_file:
      - .env
    volumes:
      - static_volume:/app/static

  redis:
    image: redis:7.2-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3

  celery:
    build: .
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      C_FORCE_ROOT: "1"
    volumes:
      - .:/app
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "pkill -0 -f 'celery -A config worker' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 3

  backend:
    build: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      static_collector:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8000))" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  static_volume:
  redis_data:

