[project]
name = "django-coursework-drf"
version = "0.1.0"
description = ""
authors = [
    {name = "name",email = "email@gmail.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "django (>=6.0.8,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "eventlet (>=0.41.2,<0.42.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ipython (>=9.17.0,<10.0.0)",
    "django-stubs (>=6.1.0,<7.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "djangorestframework-stubs (>=3.18.1,<4.0.0)",
    "coverage (>=7.16.0,<8.0.0)"
]

[tool.black]
line-length = 119
target-version = ['py314']
exclude = '''
/(
    \.git
  | __pycache__
  | env
  | venv
  | \.venv
  | migrations
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
plugins = [
    "mypy_django_plugin.main"
]

[tool.django-stubs]
django_settings_module = "config.settings"
strict_model_abstract_attrs = false
strict_settings_type = false
