name: Django CI/CD

on: [ push, pull_request ]

jobs:
  test:
    # Тестирование кода
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-cd-dummy-secret-key-just-for-testing"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Устанавливаем Poetry с интеграцией в setup-python для кэширования
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-poetry-
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root
      - name: Run migrations
        run: poetry run python manage.py migrate
      - name: Run tests
        run: poetry run python manage.py test
  lint:
    # Проверка кода на стилистические ошибки
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8
        run: flake8 .
  build:
    # Сборка Docker-образа и push в Docker Hub
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/django_homework_drf
          tags: |
            type=sha,format=long,prefix=sha-
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    # Деплой на сервер
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Prepare directories on Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p ~/app/nginx"
      - name: Copy docker-compose and nginx configs to server
        run: |
          scp -o StrictHostKeyChecking=no ./deploy/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/app/docker-compose.yml
          scp -o StrictHostKeyChecking=no nginx/nginx.conf ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/app/nginx/nginx.conf
      - name: Deploy to Server via Docker Compose
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "bash -s" << EOF
            cd ~/app
            echo '${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}' | sudo docker login -u '${{ secrets.DOCKER_HUB_USERNAME }}' --password-stdin
            if grep -q "IMAGE_TAG=" .env; then
              sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/g" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            if ! grep -q "DOCKER_HUB_USERNAME=" .env; then
              echo "DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}" >> .env
            fi
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
          EOF