user root;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/log/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование (включаем стандартный формат для удобства отладки)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Оптимизация передачи файлов
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Включаем Gzip-сжатие для ускорения загрузки статики (CSS, JS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost; # Разрешаем также локальные запросы

        client_max_body_size 10M;

        # Правильная раздача статики через alias
        location /static/ {
            alias /app/static/;
            expires 30d; # Кэшируем статику в браузере пользователя на 30 дней
            add_header Cache-Control "public, no-transform";
        }

        # Добавлена раздача медиа-файлов (загрузки пользователей)
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Проксирование запросов к Django / Gunicorn
        location / {
           proxy_pass http://backend:8000;

           # Таймауты, чтобы Nginx не падал в 504 ошибку при долгих запросах Django
           proxy_read_timeout 60s;
           proxy_connect_timeout 60s;

           # Передача реальных заголовков клиента
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
